<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — SaaSInterface 2026</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
  <!-- Ambient Graphics -->
  <div class="ambient-bg"></div>
  <div class="ambient-texture-overlay"></div>
  <div class="ambient-grid"></div>
  <div class="ambient-orb ambient-orb-1"></div>
  <div class="ambient-orb ambient-orb-2"></div>

  <div class="container px-3 position-relative" style="max-width: 450px; z-index: 2;">
    
    <!-- Brand Logo Top -->
    <div class="text-center mb-4">
      <a class="brand-logo-text justify-content-center" href="index.html">
        <div class="brand-icon-box"><i class="bi bi-layers-half"></i></div>
        <span>SaaS<span style="color: var(--olive-bright);">Interface</span></span>
      </a>
      <p class="text-muted small mt-2">Enter your credentials to access the 2026 archive.</p>
    </div>

    <!-- Login Card -->
    <div class="p-4 p-md-5 rounded-4" style="background: linear-gradient(155deg, rgba(20,32,23,0.92) 0%, rgba(10,15,11,0.95) 100%); border: 1px solid var(--border-olive); box-shadow: var(--card-shadow-hover); backdrop-filter: blur(20px);">
      
      <!-- Social SSO Buttons -->
      <div class="d-flex flex-column gap-2 mb-4">
        <button class="btn btn-classy-ghost w-100 justify-content-center">
          <i class="bi bi-github me-2" style="color: var(--olive-bright);"></i> Continue with GitHub
        </button>
        <button class="btn btn-classy-ghost w-100 justify-content-center">
          <i class="bi bi-google me-2" style="color: var(--olive-bright);"></i> Continue with Google
        </button>
        <button class="btn btn-classy-ghost w-100 justify-content-center" style="border-color: var(--border-olive-bright);">
          <i class="bi bi-fingerprint me-2" style="color: var(--olive-bright);"></i> Sign in with Passkey / WebAuthn
        </button>
      </div>

      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1 border-secondary m-0" style="opacity: 0.25;">
        <span class="px-3 text-dim small text-uppercase">or email</span>
        <hr class="flex-grow-1 border-secondary m-0" style="opacity: 0.25;">
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="mb-3">
          <label class="form-label text-white small fw-semibold">Work Email</label>
          <input type="email" class="form-control form-control-custom w-100" placeholder="name@company.com" required>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label text-white small fw-semibold">Password</label>
            <a href="#" class="small text-decoration-none" style="color: var(--olive-bright);">Forgot?</a>
          </div>
          <input type="password" class="form-control form-control-custom w-100" placeholder="••••••••••••" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input bg-dark border-secondary" type="checkbox" id="rememberMe" checked style="border-color: var(--border-olive) !important;">
          <label class="form-check-label text-muted small" for="rememberMe">Remember session on this device</label>
        </div>

        <button type="submit" class="btn btn-classy-primary w-100 justify-content-center py-2 mb-3">
          Sign In to Portal
        </button>
      </form>

      <div class="text-center text-muted small mt-4">
        Don't have an account yet? <a href="signup.html" class="fw-semibold text-decoration-none" style="color: var(--olive-soft);">Sign up</a>
      </div>

    </div>

    <!-- Back to site -->
    <div class="text-center mt-4">
      <a href="index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
